<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon/favicon.ico" type="image/x-icon">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente ou diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 700px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender reproduzir áudios em HTML5</p>
    <!--audio src="midia/LazyLauraQuincasMoreira.mp3" controls autoplay></audio-->
    <!-- MP3 WAV OGG -->
     <audio preload="auto" autoplay controls loop>
        <source src="midia/guanacast-33.mp3" type="audio/MP3">
        <source src="midia/guanacast-33.ogg" type="audio/OGG">
        <source src="midia/guanacast-33.wav" type="audio/WAV">
        <p>Infelizmente seu navegador não consegue reproduzir áudio <a href="midia/LazyLauraQuincasMoreira.mp3">Clique aqui para baixar o arquivo MP3</a></p>
     </audio>
</body>
</html>
