<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{ /* box level */

            background-color: lightgray;
            height: 300px;
            width: 300px;

            /* longhand 
            border-width: 10px;
            border-style: solid;
            border-color:darkslateblue;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

            outline-width: 10px;
            outline-style: dashed;
            outline-color: red;
            */

            /* shorthand */
            border :10px solid darkslateblue;

            padding: 10px 20px; /* isso é igual a 10px 20px 10px 20px; top right botton left */

            margin: 10px 10px 10px 10px;

            outline: 10px dashed red;

            /*
            margin:auto;
             para centraliza o h1            
            */
        }
        a{ /* inline-level */
            
            border-width: 10;
            border-style: solid;
            border-color:red;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;            
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#" > links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
